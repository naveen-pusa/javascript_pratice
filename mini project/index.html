<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

body{
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    text-align: center;
}

h1{
    color: #333;
}

#search{
    padding:10px;
    width:250px;
    margin:20px;
    border-radius:5px;
    border:1px solid gray;
}

#container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

#card{
    background:white;
    padding:15px;
    width:200px;
    border-radius:10px;
    box-shadow:0px 2px 10px rgba(0,0,0,0.2);
}

#card img{
    width:120px;
    height:100px;
}

button{
    padding:8px 12px;
    background-color:#007BFF;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background-color:#0056b3;
}

#cart{
    margin-top:20px;
}

#cart div{
    background:white;
    margin:10px auto;
    padding:10px;
    width:250px;
    border-radius:8px;
    box-shadow:0px 2px 8px rgba(0,0,0,0.2);
}

</style>
</head>
<body>
    <h1>Online Mobile Store</h1>

<input type="text" id="search" placeholder="Search mobile" onkeyup="change()">

<h2>Products</h2>
<div id="container"></div>

<h2>Cart (<span id="added">0</span>)</h2>
<div id="cart"></div>

<h3>Total Price : ₹ <span id="total">0</span></h3>

    <script src="./script.js"></script>
</body>
</html>
